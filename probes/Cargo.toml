[workspace]
resolver = "3"
members = ["wasmtime-android", "baseline-android"]

[profile.release]
strip = false

# Shipping-style profile, same for both binaries.
[profile.size]
inherits = "release"
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"

# Same without panic=abort: panics stay catchable (the bridge can turn them into Dart errors).
[profile.size-unwind]
inherits = "size"
panic = "unwind"
