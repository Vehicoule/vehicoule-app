[package]
name = "plugin-host"
version = "0.1.0"
edition.workspace = true
license = "MPL-2.0"

[dependencies]
contract = { path = "../contract" }
anyhow = "1"
reqwest = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
wasmtime.workspace = true
wasmtime-wasi.workspace = true
tokio = { version = "1", features = ["time", "net"] }

[features]
# Test doubles (`NetPolicy::for_tests`, `MemoryStorage`); never enabled by `core`.
test-util = []

[dev-dependencies]
plugin-host = { path = ".", features = ["test-util"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util"] }
wiremock = "0.6"
