[package]
name = "plugin-host"
version = "0.1.0"
edition.workspace = true
license = "MPL-2.0"

[dependencies]
contract = { path = "../contract" }
anyhow = "1"
base64 = "0.22"
bytes = "1"
ed25519-dalek = { version = "3", features = ["rand_core"] }
futures = "0.3"
getrandom = "0.4"
reqwest = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
wasmtime.workspace = true
wasmtime-wasi.workspace = true
tokio = { version = "1", features = ["time", "net", "io-util"] }
tower = { version = "0.5", default-features = false, features = ["filter"] }

[features]
# Test doubles (`NetPolicy::for_tests`, `MemoryStorage`); never enabled by `core`.
test-util = []

[dev-dependencies]
plugin-host = { path = ".", features = ["test-util"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "test-util"] }
wiremock = "0.6"
