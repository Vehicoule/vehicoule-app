[package]
name = "vehicoule-core"
version = "0.1.0"
edition.workspace = true
license = "MPL-2.0"

[lib]
name = "vehicoule_core"
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
rusqlite.workspace = true
uuid.workspace = true
unicode-normalization.workspace = true
strsim.workspace = true
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "sync"] }
plugin-host = { path = "../plugin-host" }
vehicoule-stream = { path = "../stream" }
anyhow = "1"
reqwest = "0.13"
flutter_rust_bridge = "=2.13.0"

[dev-dependencies]
# `NetPolicy::for_tests` for the test App: wiremock on http, `*.test` -> 127.0.0.1.
plugin-host = { path = "../plugin-host", features = ["test-util"] }
tokio = { version = "1", features = ["macros", "rt", "test-util"] }
wiremock = "0.6"
ed25519-dalek = "3"
sha2 = "0.10"
