[package]
name = "vehicoule-core"
version = "0.1.0"
edition.workspace = true
license = "MPL-2.0"

[lib]
name = "vehicoule_core"
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
rusqlite.workspace = true
uuid.workspace = true
unicode-normalization.workspace = true
strsim.workspace = true
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "sync"] }
plugin-host = { path = "../plugin-host" }
vehicoule-stream = { path = "../stream" }
anyhow = "1"
reqwest = "0.13"
flutter_rust_bridge = "=2.13.0"
# Integrations set by hand (debug images only): no contexts (hostname), no logs.
sentry = { version = "0.49", default-features = false, features = ["backtrace", "debug-images", "panic", "metrics", "reqwest", "rustls"] }
semver = "1"
sha2 = "0.10"
# The free space of the downloads volume (`download_storage`).
fs4 = { version = "1", default-features = false }

# Android: rustls-platform-verifier needs the app's context, handed over by JNI (android.rs).
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22"
rustls-platform-verifier = "0.7"

[dev-dependencies]
# `NetPolicy::for_tests` for the test App: wiremock on http, `*.test` -> 127.0.0.1.
plugin-host = { path = "../plugin-host", features = ["test-util"] }
tokio = { version = "1", features = ["macros", "rt", "test-util"] }
wiremock = "0.6"
ed25519-dalek = "3"
sentry = { version = "0.49", default-features = false, features = ["test"] }

[lints]
workspace = true
