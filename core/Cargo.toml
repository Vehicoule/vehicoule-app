[workspace]
resolver = "3"
members = ["contract", "core", "plugin-host"]
exclude = ["plugin-host/guests"]

[workspace.package]
edition = "2024"

[workspace.dependencies]
# Latest LTS series. No `cache` feature: compiled code only comes from this device:
# plugin-host's own compile cache.
wasmtime = { version = "48.0.6", default-features = false, features = ["std", "runtime", "cranelift", "pulley", "component-model", "async", "anyhow"] }
wasmtime-wasi = { version = "48.0.6", default-features = false, features = ["p2"] }
rusqlite = { version = "0.40", features = ["bundled", "functions"] }
uuid = { version = "1", features = ["v7"] }
unicode-normalization = "0.1"
