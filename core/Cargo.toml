[workspace]
resolver = "3"
members = ["contract", "core", "plugin-host", "stream"]
exclude = ["plugin-host/guests", "core/tests/guests"]

[workspace.package]
edition = "2024"

[workspace.dependencies]
# Latest LTS series. No `cache` feature: compiled code only comes from this device:
# plugin-host's own compile cache.
wasmtime = { version = "48.0.6", default-features = false, features = ["std", "runtime", "cranelift", "pulley", "component-model", "async", "anyhow"] }
wasmtime-wasi = { version = "48.0.6", default-features = false, features = ["p2"] }
rusqlite = { version = "0.40", features = ["bundled", "functions"] }
uuid = { version = "1", features = ["v7", "serde"] }
unicode-normalization = "0.1"
strsim = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

# panic = "unwind": flutter_rust_bridge turns a panic into a Dart exception (vehicoule-core
# refuses to build otherwise). Measured +6.46 MiB for Wasmtime in this profile.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "unwind"
