[package]
name = "vehicoule-sdk"
version = "1.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Guest-side helpers for Vehicoule plugins (contract vehicoule:music@1.1.0)."

[lib]
name = "vehicoule_sdk"

[dependencies]
form_urlencoded = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wit-bindgen = "0.63"

# Standalone: not part of the `core/` workspace.
[workspace]

# Google's Rust style guide, as clippy applies it: the same set as `core/Cargo.toml`. The
# wit-bindgen output opts out with an `#[allow]` on its module.
[lints.clippy]
unwrap_used = "warn"
undocumented_unsafe_blocks = "warn"
wildcard_imports = "warn"
redundant_clone = "warn"
implicit_clone = "warn"
